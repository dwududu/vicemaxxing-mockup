<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ViceMaxxing — clickable prototype</title>
<style>
  :root{
    --ink:#0f172a; --body:#334155; --muted:#64748b; --line:#e6ebf2; --soft:#f7f9fc;
    --accent:#1d4ed8; --chip:#eef2f8; --good:#0f7a52;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:#eef1f6; color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  #app{
    position:relative; background:#fff; max-width:430px; margin:0 auto;
    min-height:100dvh; box-shadow:0 0 60px rgba(15,23,42,.10); overflow:hidden;
  }
  @media (max-width:480px){ #app{box-shadow:none} body{background:#fff} }

  .screen{padding:8px 22px 108px}
  .status{height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 4px;
          font-size:12.5px; font-weight:600; color:var(--ink); opacity:.75}
  .eyebrow{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:650}
  .date{font-size:15px; color:var(--ink); font-weight:600; margin-top:3px}

  .big{font-size:96px; line-height:.9; letter-spacing:-.045em; font-weight:700; color:var(--ink);
       margin:22px 0 0; font-variant-numeric:tabular-nums}
  .unit{font-size:16.5px; margin-top:8px; color:var(--body)}
  .compare{margin-top:14px; display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--muted)}
  .compare b{color:var(--ink); font-weight:600}

  .cta{margin-top:22px; height:58px; border-radius:16px; background:var(--ink); color:#fff; border:0; width:100%;
       font-size:16.5px; font-weight:650; font-family:inherit; letter-spacing:.01em; cursor:pointer;
       transition:transform .08s ease, background .15s ease}
  .cta:active{transform:scale(.985); background:#1e293b}
  .cta.ghost{background:#fff; color:var(--ink); border:1.5px solid var(--line); height:50px;
             font-size:15px; font-weight:600; margin-top:10px}
  .cta.ghost:active{background:var(--soft)}

  .listhead{margin:26px 0 8px; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
            color:var(--muted); font-weight:650}
  .entry{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line);
         font-size:15px; cursor:pointer}
  .entry:active{opacity:.6}
  .entry .t{font-variant-numeric:tabular-nums; color:var(--ink); font-weight:600; width:54px}
  .entry .tag{font-size:13px; color:var(--muted)}
  .entry .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.5; margin-left:auto}
  .empty{padding:22px 0; color:#9aa5b6; font-size:14.5px; border-top:1px solid var(--line)}

  /* tabs */
  nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(430px,100%);
      height:74px; background:rgba(255,255,255,.96); backdrop-filter:blur(12px);
      border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20}
  .tab{flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:4px;
       padding:12px 0 10px; font-size:10.5px; color:#94a3b8; font-family:inherit; cursor:pointer}
  .tab.on{color:var(--ink); font-weight:650}
  .tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round}

  /* sheet */
  .veil{position:fixed; inset:0; background:rgba(15,23,42,.34); opacity:0; pointer-events:none;
        transition:opacity .22s ease; z-index:30}
  .veil.on{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:50%; bottom:0; transform:translate(-50%,104%); width:min(430px,100%);
         background:#fff; border-radius:26px 26px 0 0; padding:10px 22px calc(24px + env(safe-area-inset-bottom));
         transition:transform .26s cubic-bezier(.22,.9,.3,1); z-index:31; max-height:92dvh; overflow:auto}
  .sheet.on{transform:translate(-50%,0)}
  .grab{width:40px; height:4px; border-radius:2px; background:#dfe5ee; margin:0 auto 16px}
  .sheet h3{margin:0; font-size:21px; color:var(--ink); letter-spacing:-.01em}
  .fieldlabel{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
              font-weight:650; margin:20px 0 8px}
  input[type=time], input[type=text], input[type=number]{
    font-family:inherit; font-size:15.5px; color:var(--ink); border:1.5px solid var(--line);
    border-radius:12px; padding:11px 13px; width:100%; background:#fff; outline:none}
  input:focus{border-color:#b9c6e2}
  .cravings{display:flex; gap:9px}
  .cr{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
      display:grid; place-items:center; font-size:15px; color:var(--body); font-weight:600;
      font-family:inherit; cursor:pointer}
  .cr.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:13.5px; padding:9px 14px; border-radius:999px; background:var(--chip); color:#3b4759;
        border:0; font-family:inherit; cursor:pointer}
  .chip.on{background:#e3eafd; color:var(--accent); font-weight:650}
  .rowbtns{display:flex; gap:10px; align-items:center; margin-top:20px}
  .rowbtns .cta{margin-top:0}
  .del{background:none; border:0; color:#b42318; font-size:14.5px; font-family:inherit; font-weight:600;
       padding:12px 4px; cursor:pointer}

  /* stats */
  .seg{display:flex; background:#eef1f6; border-radius:11px; padding:3px; margin-top:12px; font-size:14px; font-weight:600}
  .seg button{flex:1; border:0; background:none; font-family:inherit; font-size:14px; font-weight:600;
              padding:8px 0; border-radius:9px; color:#64748b; cursor:pointer}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(15,23,42,.10)}
  .hero-num{margin-top:22px; display:flex; align-items:baseline; gap:9px}
  .hero-num b{font-size:54px; line-height:1; letter-spacing:-.035em; color:var(--ink); font-variant-numeric:tabular-nums}
  .hero-num span{font-size:14.5px; color:var(--muted)}
  .delta{margin-top:6px; font-size:13.5px; font-weight:600}
  .chart{margin-top:20px; height:140px; display:flex; align-items:flex-end; gap:5px}
  .bar{flex:1; background:#dbe3ef; border-radius:4px 4px 2px 2px; min-height:3px}
  .bar.hi{background:var(--accent)}
  .axis{margin-top:6px; display:flex; gap:5px; font-size:10px; color:#9aa5b6}
  .axis div{flex:1; text-align:center; overflow:hidden; white-space:nowrap}
  .cards{display:flex; gap:11px; margin-top:22px}
  .card{flex:1; border:1px solid var(--line); border-radius:14px; padding:13px 14px; background:var(--soft)}
  .card .k{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:650}
  .card .v{font-size:22px; color:var(--ink); font-weight:650; margin-top:6px; letter-spacing:-.02em;
           font-variant-numeric:tabular-nums}
  .card .s{font-size:12px; color:var(--muted); margin-top:2px}

  /* history */
  .monthbar{display:flex; align-items:center; justify-content:space-between; margin-top:14px}
  .monthbar b{font-size:19px; color:var(--ink)}
  .navbtns{display:flex; gap:8px}
  .navbtns button{width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:#fff;
                  color:#8492a6; font-size:14px; font-family:inherit; cursor:pointer}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:18px; font-size:10.5px;
       color:#9aa5b6; text-align:center; letter-spacing:.06em}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:7px}
  .cell{aspect-ratio:1/1; border-radius:9px; display:grid; place-items:center; font-size:13px; color:#41506a;
        font-variant-numeric:tabular-nums; background:#fff; border:1px solid #eef1f6; font-family:inherit; cursor:pointer}
  .cell.mute{color:#c9d1dd; background:#fbfcfe; border-color:#f4f7fb; cursor:default}
  .cell.today{outline:2px solid var(--accent); outline-offset:-1px; font-weight:700; color:var(--accent)}
  .cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
  .legend{display:flex; align-items:center; gap:6px; margin-top:16px; font-size:11px; color:#9aa5b6}
  .legend i{width:13px; height:13px; border-radius:4px; display:block}
  .daypanel{margin-top:18px; border-top:1px solid var(--line); padding-top:12px}
  .daypanel .h{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px}
  .daypanel .h b{font-size:15px; color:var(--ink)}
  .daypanel .h span{font-size:13px; color:var(--muted)}

  /* settings */
  .srow{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 0;
        border-bottom:1px solid var(--line)}
  .srow .lab{font-size:15px; color:var(--ink); font-weight:550}
  .srow .sub{font-size:12.5px; color:var(--muted); margin-top:2px}
  .srow input[type=number]{width:104px; text-align:right}
  .srow input[type=time]{width:146px; text-align:right}
  .switch{position:relative; width:48px; height:28px; border-radius:999px; background:#dbe3ef; border:0;
          cursor:pointer; transition:background .18s ease; flex:0 0 auto}
  .switch.on{background:var(--accent)}
  .switch i{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff;
            transition:transform .18s ease; box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on i{transform:translateX(20px)}
  .danger{color:#b42318; border:1.5px solid #f3d6d4; background:#fff; border-radius:12px; width:100%;
          padding:14px; font-size:15px; font-family:inherit; font-weight:600; margin-top:18px; cursor:pointer}
  .ghostbtn{border:1.5px solid var(--line); background:#fff; border-radius:12px; width:100%; padding:14px;
            font-size:15px; font-family:inherit; font-weight:600; color:var(--ink); margin-top:10px; cursor:pointer}
  .note{font-size:12.5px; color:#94a3b8; margin-top:14px; line-height:1.5}

  /* intro */
  .intro{position:fixed; inset:0; background:#fff; z-index:50; display:flex; flex-direction:column;
         justify-content:space-between; padding:56px 28px 40px; max-width:430px; margin:0 auto}
  .intro.hidden{display:none}
  .intro .kicker{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:650}
  .intro h1{font-size:34px; line-height:1.12; letter-spacing:-.025em; color:var(--ink); margin:16px 0 0}
  .intro p{font-size:16px; color:var(--body); margin:14px 0 0; max-width:26em}
  .intro .foot{font-size:13px; color:#94a3b8}

  #toast{position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px); background:#0f172a; color:#fff;
         font-size:14px; padding:11px 18px; border-radius:999px; opacity:0; transition:all .2s ease;
         pointer-events:none; z-index:40; white-space:nowrap}
  #toast.on{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="app">
  <div id="screen"></div>
  <nav id="tabs"></nav>
</div>

<div class="intro" id="intro">
  <div>
    <div class="kicker">Prototype</div>
    <h1>Every cigarette, counted.</h1>
    <p>One tap logs one. Numbers come back honest — no streaks to break, no lectures.</p>
  </div>
  <div>
    <p style="font-size:14px; color:var(--muted); margin:0 0 18px">This is a clickable mock-up. Data lives in this browser only. Nothing is sent anywhere.</p>
    <button class="cta" id="introGo">Start</button>
    <p class="foot" style="margin-top:18px">ViceMaxxing · a prototype, not the app</p>
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
(() => {
  const KEY = 'vicemaxxing.prototype.v1';
  const UNIT_PRICE_DEFAULT = 107, STICKS_DEFAULT = 20;
  const TRIGGERS = ['Coffee','Stress','Social','After meal','Boredom','Other'];
  const DAY = 86400000;

  // deterministic pseudo-random so the demo looks the same on every load
  let seed = 20261021;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];

  const today = new Date();
  today.setHours(0,0,0,0);

  function seedEvents(){
    const out = [];
    for (let back = 29; back >= 0; back--){
      const day = new Date(today.getTime() - back * DAY);
      let count = 6 + Math.floor(rnd() * 6);
      if (back === 0) count = Math.min(count, Math.max(3, Math.round((new Date().getHours()) / 3)));
      for (let i = 0; i < count; i++){
        const hour = 7 + Math.floor((i / count) * 15) + Math.floor(rnd() * 2);
        const d = new Date(day); d.setHours(hour, Math.floor(rnd() * 60), 0, 0);
        if (d > new Date()) continue;
        out.push({
          id: 'e' + d.getTime() + i,
          ts: d.toISOString(),
          craving: 1 + Math.floor(rnd() * 5),
          trigger: pick(TRIGGERS),
          note: ''
        });
      }
    }
    return out.sort((a,b) => new Date(a.ts) - new Date(b.ts));
  }

  const fresh = () => ({ price: UNIT_PRICE_DEFAULT, sticks: STICKS_DEFAULT, reminder: true,
                         reminderTime: '21:00', intro: false, events: seedEvents() });

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e){ state = fresh(); }
  if (!state.events) state = fresh();
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));

  let tab = 'today';
  let statsWindow = 7;
  let calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  let selectedDay = new Date(today);
  let editing = null;

  const unitPrice = () => state.price / state.sticks;
  const money = n => 'HK$' + (n >= 100 ? Math.round(n) : n.toFixed(2));
  const moneyRound = n => 'HK$' + Math.round(n);
  const hhmm = d => d.toTimeString().slice(0,5);
  const clock = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const dayKey = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
  const eventsOn = d => state.events.filter(e => dayKey(e.ts) === dayKey(d));
  const countOn = d => eventsOn(d).length;

  function lastNDays(n){
    const out = [];
    for (let i = n - 1; i >= 0; i--) out.push(new Date(today.getTime() - i * DAY));
    return out;
  }

  function longestGap(events){
    if (events.length < 2) return 0;
    let max = 0;
    for (let i = 1; i < events.length; i++){
      max = Math.max(max, new Date(events[i].ts) - new Date(events[i-1].ts));
    }
    return max;
  }
  const dur = ms => {
    const h = Math.floor(ms / 3600000), m = Math.round((ms % 3600000) / 60000);
    return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
  };

  const E = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* ---------- screens ---------- */

  function screenToday(){
    const n = countOn(new Date());
    const yes = countOn(new Date(Date.now() - DAY));
    const week = lastNDays(7).reduce((a,d) => a + countOn(d), 0) / 7;
    const evs = eventsOn(new Date()).sort((a,b) => new Date(b.ts) - new Date(a.ts));
    const diff = n - yes;
    return `
      <div class="status"><span>${clock()}</span><span>ViceMaxxing</span></div>
      <div class="eyebrow">Today</div>
      <div class="date">${new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}</div>
      <div class="big">${n}</div>
      <div class="unit">cigarette${n === 1 ? '' : 's'}</div>
      <div class="compare">
        <span>Yesterday <b>${yes}</b></span>
        <span>7-day avg <b>${week.toFixed(1)}</b></span>
        <span><b>${diff === 0 ? '±0' : (diff > 0 ? '+' : '') + diff}</b> vs yesterday</span>
      </div>
      <button class="cta" data-act="log-one">Log one</button>
      <button class="cta ghost" data-act="log-details">Log with details</button>
      <div class="listhead">Today</div>
      ${evs.length ? evs.map(e => `
        <div class="entry" data-edit="${e.id}">
          <span class="t">${hhmm(new Date(e.ts))}</span>
          <span class="tag">${e.trigger ? E(e.trigger) : 'no trigger'}${e.craving ? ' · ' + e.craving + '/5' : ''}</span>
          <span class="dot"></span>
        </div>`).join('') : `<div class="empty">Nothing logged yet today. One tap when you light up.</div>`}
    `;
  }

  function screenHistory(){
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7; // Monday-first
    const counts = [];
    for (let d = 1; d <= daysInMonth; d++) counts.push(countOn(new Date(first.getFullYear(), first.getMonth(), d)));
    const max = Math.max(3, ...counts);
    const shade = n => n === 0 ? '#ffffff' : n / max < .35 ? '#eef1f6' : n / max < .6 ? '#dbe3ef' : n / max < .85 ? '#a9bbdd' : '#1d4ed8';
    const inkFor = n => n / max >= .85 ? '#ffffff' : '#41506a';

    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<div class="cell mute"></div>';
    for (let d = 1; d <= daysInMonth; d++){
      const date = new Date(first.getFullYear(), first.getMonth(), d);
      const n = counts[d-1];
      const future = date > today;
      const isToday = dayKey(date) === dayKey(today);
      const sel = dayKey(date) === dayKey(selectedDay);
      const cls = ['cell', future ? 'mute' : '', isToday ? 'today' : '', sel && !isToday ? 'sel' : ''].join(' ');
      const bg = (n && !future) ? shade(n) : '';
      const col = (n && !future) ? inkFor(n) : '';
      cells += `<button class="${cls}" data-day="${d}" ${future || !n && !isToday ? '' : ''}
                 style="${bg ? `background:${bg};border-color:${bg};color:${col}` : ''}">${d}</button>`;
    }

    const selEvents = eventsOn(selectedDay).sort((a,b) => new Date(b.ts) - new Date(a.ts));
    const selCount = selEvents.length;

    return `
      <div class="status"><span>${clock()}</span><span>History</span></div>
      <div class="eyebrow">History</div>
      <div class="monthbar">
        <b>${calMonth.toLocaleDateString('en-GB',{month:'long', year:'numeric'})}</b>
        <div class="navbtns">
          <button data-month="-1">‹</button>
          <button data-month="1">›</button>
        </div>
      </div>
      <div class="dow">${['M','T','W','T','F','S','S'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal">${cells}</div>
      <div class="legend">Less<i style="background:#eef1f6"></i><i style="background:#dbe3ef"></i><i style="background:#a9bbdd"></i><i style="background:#1d4ed8"></i>More</div>
      <div class="daypanel">
        <div class="h">
          <b>${selectedDay.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'})}</b>
          <span>${selCount} cigarette${selCount === 1 ? '' : 's'} · ${moneyRound(selCount * unitPrice())}</span>
        </div>
        ${selEvents.length ? selEvents.map(e => `
          <div class="entry" data-edit="${e.id}">
            <span class="t">${hhmm(new Date(e.ts))}</span>
            <span class="tag">${e.trigger ? E(e.trigger) : 'no trigger'}${e.craving ? ' · ' + e.craving + '/5' : ''}</span>
            <span class="dot"></span>
          </div>`).join('') : `<div class="empty">Nothing logged.</div>`}
      </div>
    `;
  }

  function screenStats(){
    const days = lastNDays(statsWindow);
    const counts = days.map(d => countOn(d));
    const total = counts.reduce((a,b) => a + b, 0);
    const avg = total / statsWindow;
    const prevDays = [];
    for (let i = statsWindow * 2 - 1; i >= statsWindow; i--) prevDays.push(new Date(today.getTime() - i * DAY));
    const prevAvg = prevDays.reduce((a,d) => a + countOn(d), 0) / statsWindow;
    const deltaPct = prevAvg ? Math.round(((avg - prevAvg) / prevAvg) * 100) : 0;
    const max = Math.max(1, ...counts);

    const rangeEvents = state.events.filter(e => new Date(e.ts) >= days[0] && new Date(e.ts) < new Date(today.getTime() + DAY));
    const byTrigger = {};
    rangeEvents.forEach(e => { const k = e.trigger || 'Untagged'; byTrigger[k] = (byTrigger[k] || 0) + 1; });
    const trigRows = Object.entries(byTrigger).sort((a,b) => b[1] - a[1]).slice(0,4);

    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const monthCount = state.events.filter(e => new Date(e.ts) >= monthStart).length;
    const gap = longestGap([...rangeEvents].sort((a,b) => new Date(a.ts) - new Date(b.ts)));

    const label = d => statsWindow === 7
      ? d.toLocaleDateString('en-GB',{weekday:'narrow'})
      : (d.getDate() % 5 === 0 || d.getDate() === 1 ? String(d.getDate()) : '');

    return `
      <div class="status"><span>${clock()}</span><span>Stats</span></div>
      <div class="eyebrow">Stats</div>
      <div class="seg">
        <button data-win="7" class="${statsWindow === 7 ? 'on' : ''}">7 days</button>
        <button data-win="30" class="${statsWindow === 30 ? 'on' : ''}">30 days</button>
      </div>
      <div class="hero-num"><b>${avg.toFixed(1)}</b><span>per day</span></div>
      <div class="delta" style="color:var(--muted)">
        ${deltaPct === 0 ? 'Same as' : (deltaPct > 0 ? '+' : '') + deltaPct + '% vs'} the ${statsWindow} days before
      </div>
      <div class="chart">
        ${counts.map(c => `<div class="bar ${c >= avg ? 'hi' : ''}" style="height:${Math.round(c / max * 100)}%"></div>`).join('')}
      </div>
      <div class="axis">${days.map(d => `<div>${label(d)}</div>`).join('')}</div>
      <div class="cards">
        <div class="card"><div class="k">Spend</div><div class="v">${moneyRound(monthCount * unitPrice())}</div><div class="s">this month</div></div>
        <div class="card"><div class="k">Longest gap</div><div class="v">${gap ? dur(gap) : '—'}</div><div class="s">last ${statsWindow} days</div></div>
      </div>
      <div class="listhead">By trigger${Object.keys(byTrigger).length > 4 ? ' · top 4 of ' + Object.keys(byTrigger).length : ''}</div>
      ${trigRows.length ? trigRows.map(([k,v]) => `
        <div class="entry" style="cursor:default">
          <span class="t" style="width:auto">${E(k)}</span>
          <span class="tag">${Math.round(v / rangeEvents.length * 100)}% · ${v}</span>
          <span class="dot"></span>
        </div>`).join('') : `<div class="empty">No entries in this window.</div>`}
    `;
  }

  function screenSettings(){
    return `
      <div class="status"><span>${clock()}</span><span>Settings</span></div>
      <div class="eyebrow">Settings</div>
      <div class="date" style="margin-bottom:8px">Your numbers</div>
      <div class="srow">
        <div><div class="lab">Pack price</div><div class="sub">what you actually pay</div></div>
        <input type="number" id="price" value="${state.price}" min="1" step="1" inputmode="numeric">
      </div>
      <div class="srow">
        <div><div class="lab">Sticks per pack</div><div class="sub">usually 20</div></div>
        <input type="number" id="sticks" value="${state.sticks}" min="1" step="1" inputmode="numeric">
      </div>
      <div class="srow">
        <div><div class="lab">Cost per cigarette</div><div class="sub">used for every money figure</div></div>
        <div style="font-size:16px; color:var(--ink); font-weight:650">HK$${unitPrice().toFixed(2)}</div>
      </div>
      <div class="srow">
        <div><div class="lab">Daily reminder</div><div class="sub">a nudge, not a lecture</div></div>
        <button class="switch ${state.reminder ? 'on' : ''}" id="reminder"><i></i></button>
      </div>
      ${state.reminder ? `<div class="srow"><div class="lab">Reminder time</div>
        <input type="time" id="rtime" value="${state.reminderTime}"></div>` : ''}
      <button class="ghostbtn" id="export">Export data</button>
      <button class="danger" id="wipe">Delete everything</button>
      <p class="note">Prototype note: export downloads the JSON this screen has been building. In the real app it opens the Android share sheet.</p>
    `;
  }

  const SCREENS = { today: screenToday, history: screenHistory, stats: screenStats, settings: screenSettings };

  const TABS = [
    ['today','Today','<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'],
    ['history','History','<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'],
    ['stats','Stats','<path d="M5 19V11M12 19V5M19 19v-6"/>'],
    ['settings','Settings','<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>']
  ];

  function render(){
    document.getElementById('screen').innerHTML = `<div class="screen">${SCREENS[tab]()}</div>`;
    document.getElementById('tabs').innerHTML = TABS.map(([id,label,icon]) => `
      <button class="tab ${tab === id ? 'on' : ''}" data-tab="${id}">
        <svg viewBox="0 0 24 24">${icon}</svg>${label}
      </button>`).join('');
    window.scrollTo(0,0);
  }

  /* ---------- interactions ---------- */

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600);
  }

  function addEvent(extra){
    const now = new Date();
    const ev = Object.assign({ id: 'e' + Date.now() + Math.floor(Math.random()*1000), ts: now.toISOString(),
                               craving: 0, trigger: '', note: '' }, extra || {});
    state.events.push(ev); save(); render();
    return ev;
  }

  function openSheet(ev){
    editing = ev || null;
    const d = ev ? new Date(ev.ts) : new Date();
    const sheet = document.getElementById('sheet');
    sheet.innerHTML = `
      <div class="grab"></div>
      <h3>${ev ? 'Edit' : 'Log a'} cigarette</h3>
      <div class="fieldlabel">Time</div>
      <input type="time" id="stime" value="${hhmm(d)}">
      <div class="fieldlabel">Craving</div>
      <div class="cravings" id="scrave">
        ${[1,2,3,4,5].map(n => `<button class="cr ${ev && ev.craving === n ? 'on' : ''}" data-cr="${n}">${n}</button>`).join('')}
      </div>
      <div class="fieldlabel">Trigger · optional</div>
      <div class="chips" id="schip">
        ${TRIGGERS.map(t => `<button class="chip ${ev && ev.trigger === t ? 'on' : ''}" data-trig="${t}">${t}</button>`).join('')}
      </div>
      <div class="rowbtns">
        <button class="cta" id="ssave">Save</button>
        ${ev ? '<button class="del" id="sdel">Delete</button>' : ''}
      </div>`;
    const toastEl = document.getElementById('toast');
    toastEl.classList.remove('on');
    sheet.classList.add('on');
    document.getElementById('veil').classList.add('on');

    let craving = ev ? ev.craving : 0, trigger = ev ? ev.trigger : '';
    sheet.querySelectorAll('[data-cr]').forEach(b => {
      b.onclick = () => {
        const n = +b.dataset.cr;
        craving = craving === n ? 0 : n;
        sheet.querySelectorAll('[data-cr]').forEach(x => x.classList.toggle('on', +x.dataset.cr === craving));
      };
    });
    sheet.querySelectorAll('[data-trig]').forEach(b => {
      b.onclick = () => {
        trigger = trigger === b.dataset.trig ? '' : b.dataset.trig;
        sheet.querySelectorAll('[data-trig]').forEach(x => x.classList.toggle('on', x.dataset.trig === trigger));
      };
    });
    document.getElementById('ssave').onclick = () => {
      const [h,m] = document.getElementById('stime').value.split(':').map(Number);
      const base = ev ? new Date(ev.ts) : new Date();
      base.setHours(h || 0, m || 0, 0, 0);
      if (ev){
        ev.ts = base.toISOString(); ev.craving = craving; ev.trigger = trigger;
        save(); closeSheet(); render(); toast('Saved');
      } else {
        closeSheet(); addEvent({ ts: base.toISOString(), craving, trigger }); toast('Logged · ' + hhmm(base));
      }
    };
    const del = document.getElementById('sdel');
    if (del) del.onclick = () => {
      state.events = state.events.filter(x => x.id !== ev.id);
      save(); closeSheet(); render(); toast('Deleted');
    };
  }

  function closeSheet(){
    document.getElementById('sheet').classList.remove('on');
    document.getElementById('veil').classList.remove('on');
  }

  document.getElementById('veil').onclick = closeSheet;

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (t){ tab = t.dataset.tab; render(); return; }

    const one = e.target.closest('[data-act]');
    if (one){
      if (one.dataset.act === 'log-one'){ const ev = addEvent(); toast('Logged · ' + hhmm(new Date(ev.ts))); }
      if (one.dataset.act === 'log-details'){ openSheet(null); }
      return;
    }

    const edit = e.target.closest('[data-edit]');
    if (edit){ const ev = state.events.find(x => x.id === edit.dataset.edit); if (ev) openSheet(ev); return; }

    const day = e.target.closest('[data-day]');
    if (day){ selectedDay = new Date(calMonth.getFullYear(), calMonth.getMonth(), +day.dataset.day); render(); return; }

    const mon = e.target.closest('[data-month]');
    if (mon){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +mon.dataset.month, 1); render(); return; }

    const win = e.target.closest('[data-win]');
    if (win){ statsWindow = +win.dataset.win; render(); return; }

    if (e.target.id === 'reminder'){ state.reminder = !state.reminder; save(); render(); return; }

    if (e.target.id === 'export'){
      const blob = new Blob([JSON.stringify(state.events.map(x => ({ time: x.ts, craving: x.craving, trigger: x.trigger })), null, 2)],
                            {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'vicemaxxing-export.json'; a.click();
      toast('Exported');
      return;
    }

    if (e.target.id === 'wipe'){
      if (confirm('Delete every entry? This cannot be undone.')){
        state.events = []; save(); render(); toast('Everything deleted');
      }
      return;
    }
  });

  document.addEventListener('change', e => {
    if (e.target.id === 'price'){ state.price = Math.max(1, +e.target.value || 1); save(); render(); }
    if (e.target.id === 'sticks'){ state.sticks = Math.max(1, +e.target.value || 1); save(); render(); }
    if (e.target.id === 'rtime'){ state.reminderTime = e.target.value; save(); }
  });

  document.getElementById('introGo').onclick = () => {
    document.getElementById('intro').classList.add('hidden');
    state.intro = true; save();
  };

  if (state.intro) document.getElementById('intro').classList.add('hidden');
  render();
})();
</script>
</body>
</html>
